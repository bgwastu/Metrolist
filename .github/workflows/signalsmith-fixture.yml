name: Signalsmith fixture

on:
  push:
    branches: [test/signalsmith-playback]

permissions:
  contents: read

jobs:
  desktop:
    if: github.repository == 'bgwastu/Metrolist'
    name: DSP fixture (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure
        if: matrix.runner != 'windows-11-arm'
        run: cmake -S scripts/signalsmith-smoke -B fixture-build -DCMAKE_BUILD_TYPE=Release
      - name: Configure Windows ARM64
        if: matrix.runner == 'windows-11-arm'
        run: cmake -S scripts/signalsmith-smoke -B fixture-build -A ARM64
      - run: cmake --build fixture-build --config Release
      - run: ctest --test-dir fixture-build -C Release --verbose

  ios-simulator:
    if: github.repository == 'bgwastu/Metrolist'
    name: DSP fixture (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and run the arm64 simulator fixture
        shell: bash
        run: |
          set -euo pipefail
          stretch=signalsmithStretch/src/main/jni
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator clang++ -target arm64-apple-ios18.0-simulator -isysroot "$sdk" \
            -std=c++17 -O2 -I "$stretch" -I "$stretch/third_party" scripts/signalsmith-smoke/fixture.cpp \
            -o "$RUNNER_TEMP/signalsmith-fixture"
          device="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          print(next(device["udid"] for runtime, devices in json.load(sys.stdin)["devices"].items()
              if "iOS" in runtime for device in devices if device["name"].startswith("iPhone")))
          ')"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl spawn "$device" "$RUNNER_TEMP/signalsmith-fixture"

  linux-package:
    if: github.repository == 'bgwastu/Metrolist'
    name: Packaged JVM playback (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
      - name: Install desktop runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 libdrm2 libegl1 libfontconfig1 libfreetype6 libgl1 \
            libpulse0 libva-drm2 libva2 libx11-6 libxcb-shm0
      - name: Prepare ARM64 WebView build
        if: runner.arch == 'ARM64'
        uses: ./.github/actions/prepare-linux-webview
      - name: Package the desktop JVM app
        run: >
          ./gradlew --console=plain --no-parallel --max-workers=1
          "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8"
          :desktopApp:createDistributable
      - name: Load the shipped library and verify cue timing
        shell: bash
        run: |
          set -euo pipefail
          cmake -S scripts/signalsmith-smoke -B fixture-build -DCMAKE_BUILD_TYPE=Release
          cmake --build fixture-build --config Release
          package_jar="$(find desktopApp/build/compose/binaries/main/app -name 'shared-desktop*.jar' -print -quit)"
          test -n "$package_jar"
          fixture_dir="$RUNNER_TEMP/signalsmith-fixture"
          mkdir -p "$fixture_dir"
          fixture-build/signalsmith-fixture generate "$fixture_dir/input.pcm"
          javac -d "$fixture_dir" scripts/signalsmith-smoke/PackagedSignalsmithFixture.java
          java --enable-native-access=ALL-UNNAMED -Djava.awt.headless=true -cp "$fixture_dir:${package_jar%/*}/*" \
            PackagedSignalsmithFixture desktop "$fixture_dir"
          fixture-build/signalsmith-fixture check "$fixture_dir/slow.pcm" "$fixture_dir/fast.pcm"
